AWSTemplateFormatVersion: '2010-09-09'
Description: 'Promethium Intelligent Edge — VPC, Subnets, and NAT Gateway'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Core (Required)"
        Parameters:
          - Environment
          - CompanyName
      - Label:
          default: "VPC Configuration"
        Parameters:
          - VpcName
          - VpcCidrBlock
      - Label:
          default: "EKS Configuration"
        Parameters:
          - EksClusterName
    ParameterLabels:
      Environment:
        default: "Environment (dev/qa/preview/prod)"
      CompanyName:
        default: "Company Name"
      VpcName:
        default: "VPC Name"
      VpcCidrBlock:
        default: "VPC CIDR Block (minimum /22)"
      EksClusterName:
        default: "EKS Cluster Name (used for subnet tags)"

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - qa
      - preview
      - prod
    Description: >-
      Deployment environment for this tenant. REQUIRED — no default, so a stack
      can never silently provision prod-shaped names. Used (with CompanyName)
      to compute the default EKS cluster name below when EksClusterName is left
      blank, and stamped as an Environment tag on every resource in this stack.

  CompanyName:
    Type: String
    Description: >-
      Short company identifier (e.g. acme), lowercase, no spaces (recommended
      max 15 chars). Used (with Environment) to compute the default EKS cluster
      name below when EksClusterName is left blank. REQUIRED.

  VpcName:
    Type: String
    Default: promethium-vpc
    Description: Name tag for the VPC

  VpcCidrBlock:
    Type: String
    Default: 10.0.0.0/22
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR block for the VPC (minimum /22 required). Will be split into 4 /24 subnets.

  EksClusterName:
    Type: String
    Default: ''
    Description: >-
      Optional EKS cluster name override, applied as the required kubernetes
      subnet tags. Leave blank to use the default format
      promethium-datafabric-<Environment>-<CompanyName>-eks-cluster — this MUST
      match the actual EKS cluster name Terraform creates (custom_cluster_name /
      eks_cluster_name in terraform.tfvars), since these subnet tags are how the
      AWS Load Balancer Controller and cluster-autoscaler discover subnets.

Conditions:
  HasCustomEksClusterName: !Not [!Equals [!Ref EksClusterName, '']]

Resources:

  # ── VPC ───────────────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidrBlock
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Ref VpcName
        - Key: Environment
          Value: !Ref Environment

  # ── Internet Gateway ──────────────────────────────────────────────────────────

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-igw
        - Key: Environment
          Value: !Ref Environment

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ── Subnets ───────────────────────────────────────────────────────────────────
  # Subnet layout from a /22 (e.g. 10.0.0.0/22):
  #   Subnet1: .0.0/24  AZ-a  Private  EKS nodes
  #   Subnet2: .1.0/24  AZ-b  Private  EKS nodes
  #   Subnet3: .2.0/24  AZ-c  Private  EKS nodes
  #   Subnet4: .3.0/24  AZ-a  Public   NAT Gateway

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidrBlock, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-1
        - Key: Environment
          Value: !Ref Environment
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub
            - kubernetes.io/cluster/${ClusterNameEffective}
            - ClusterNameEffective: !If [HasCustomEksClusterName, !Ref EksClusterName, !Sub 'promethium-datafabric-${Environment}-${CompanyName}-eks-cluster']
          Value: owned

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidrBlock, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-2
        - Key: Environment
          Value: !Ref Environment
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub
            - kubernetes.io/cluster/${ClusterNameEffective}
            - ClusterNameEffective: !If [HasCustomEksClusterName, !Ref EksClusterName, !Sub 'promethium-datafabric-${Environment}-${CompanyName}-eks-cluster']
          Value: owned

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidrBlock, 4, 8]]
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-3
        - Key: Environment
          Value: !Ref Environment
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub
            - kubernetes.io/cluster/${ClusterNameEffective}
            - ClusterNameEffective: !If [HasCustomEksClusterName, !Ref EksClusterName, !Sub 'promethium-datafabric-${Environment}-${CompanyName}-eks-cluster']
          Value: owned

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidrBlock, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-1
        - Key: Environment
          Value: !Ref Environment

  # ── NAT Gateway ───────────────────────────────────────────────────────────────

  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-nat-eip
        - Key: Environment
          Value: !Ref Environment

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-nat
        - Key: Environment
          Value: !Ref Environment

  # ── Route Tables ──────────────────────────────────────────────────────────────

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-rt
        - Key: Environment
          Value: !Ref Environment

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-rt
        - Key: Environment
          Value: !Ref Environment

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${AWS::StackName}-VpcId

  VpcCidrBlock:
    Description: VPC CIDR Block
    Value: !GetAtt VPC.CidrBlock
    Export:
      Name: !Sub ${AWS::StackName}-VpcCidrBlock

  Subnet1Id:
    Description: Private Subnet 1 ID (AZ-a) — use in vpc_info.subnet_ids
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-Subnet1Id

  Subnet2Id:
    Description: Private Subnet 2 ID (AZ-b) — use in vpc_info.subnet_ids
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-Subnet2Id

  Subnet3Id:
    Description: Private Subnet 3 ID (AZ-c) — use in vpc_info.subnet_ids
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub ${AWS::StackName}-Subnet3Id

  Subnet4Id:
    Description: Public Subnet 1 ID (AZ-a) — NAT Gateway only, not used in tfvars
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-Subnet4Id

