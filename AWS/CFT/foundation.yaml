        - HasCustomGlueTrinoRoleName
        - !Ref GlueTrinoServiceRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-trino-oidc-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": "system:serviceaccount:intelligentedge:trino-sa"
                    }
                  }
                },
                {
                  "Sid": "AllowGlueService",
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "glue.amazonaws.com"
                  },
                  "Action": "sts:AssumeRole"
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: GlueTrinoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchCreatePartition
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:BatchDeleteTable
                  - glue:DeleteDatabase
                  - glue:GetCrawler
                  - glue:DeleteCrawler
                  - glue:StopCrawler
                  - glue:UpdateCrawler
                  - glue:StartCrawler
                  - glue:BatchGetPartition
                Effect: Allow
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/*/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/*'
              - Action:
                  - glue:GetCrawlers
                  - glue:ListCrawlers
                  - glue:CreateDatabase
                  - glue:CreateCrawler
                Effect: Allow
                Resource: '*'
              - Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectTagging
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionTagging
                  - s3:GetObjectACL
                  - s3:PutObjectACL
                  - s3:ListBucket
                Effect: Allow
                Resource:
                  - 'arn:aws:s3:::*'
                  - 'arn:aws:s3:::*/*'
              - Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Effect: Allow
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              # Let the Trino IRSA role pass ITSELF to Glue (paired with the
              # AllowGlueService trust statement above) so Glue crawlers/jobs can
              # run under this role — matches legacy trino-oidc.tf, not the
              # unrelated AWSGlueServiceRoleDefault the CFT lineage had.
              - Action:
                  - iam:PassRole
                Effect: Allow
                Resource: !If
                  - HasCustomGlueTrinoRoleName
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GlueTrinoServiceRoleName}'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/promethium-${Environment}-${CompanyName}-trino-oidc-role'
                Condition:
                  StringEquals:
                    iam:PassedToService: glue.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: ARN of the Terraform deploy/install role — set terraform_assume_role_arn to this.
    Value: !GetAtt TerraformInstallRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DeployRoleArn'

  InstanceProfileArn:
    Description: ARN of the jumpbox instance profile
    Value: !GetAtt TerraformInstanceProfile.Arn
    Export:
      Name: !Sub '${AWS::StackName}-InstanceProfileArn'

  InstanceProfileName:
    Description: Name of the jumpbox instance profile — pass as UseExistingInstanceProfile to jumpbox.yaml
    Value: !Ref TerraformInstanceProfile
    Export:
      Name: !Sub '${AWS::StackName}-InstanceProfileName'

  EBSCSIDriverRoleArn:
    Description: ARN of the EBS CSI Driver role
    Value: !GetAtt EBSCSIDriverRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EBSCSIRoleArn

  EFSCSIDriverRoleArn:
    Description: ARN of the EFS CSI Driver role
    Value: !GetAtt EFSCSIDriverRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EFSCSIRoleArn

  LoadBalancerControllerRoleArn:
    Description: ARN of the Load Balancer Controller role
    Value: !GetAtt LoadBalancerControllerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LBRoleArn

  ClusterAutoscalerRoleArn:
    Description: ARN of the Cluster Autoscaler role
    Value: !GetAtt ClusterAutoscalerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CARoleArn

  EKSClusterRoleArn:
    Description: ARN of the EKS Cluster role
    Value: !GetAtt EKSClusterRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EKSClusterRoleArn

  EKSWorkerNodeRoleArn:
    Description: ARN of the EKS Worker Node role
    Value: !GetAtt EKSWorkerNodeRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EKSWorkerRoleArn

  PGBackupServiceRoleArn:
    Description: ARN of the PostgreSQL Backup Service role
    Value: !GetAtt PGBackupServiceRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PGBackupRoleArn

  GlueTrinoServiceRoleArn:
    Description: ARN of the Glue Trino Service role
    Value: !GetAtt GlueTrinoServiceRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GlueTrinoRoleArn

  TfStateBucket:
    Description: Terraform state S3 bucket (S3-native locking; no DynamoDB)
    Value: !Ref TfStateBucket
    Export:
      Name: !Sub '${AWS::StackName}-TfStateBucket'
