AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Promethium Intelligent Edge — Operational roles stack for a customer-account
  install. Creates the 8 EKS/OIDC "operational" roles (EBS CSI driver, EFS CSI
  driver, LB controller, cluster autoscaler, EKS cluster role, EKS worker-node
  role, PG backup, Glue/Trino) plus the Lambda-backed TagResolver custom
  resource used to tag them.

  Split out of foundation.yaml (which now holds only the Terraform
  deploy/install role + tfstate bucket) so each rendered template stays under
  CloudFormation's 51,200-byte inline (--template-file, no S3 bucket) size
  limit — see AWS/scripts/prereqs.sh, which deploys foundation.yaml then this
  stack (then, optionally, jumpbox.yaml) in order. Deploy this AFTER
  foundation.yaml, with OIDCProviderUrl left at its dummy default — Terraform
  creates the real cluster and OIDC provider afterwards, then patches these
  roles' trust policies to the real URL via iam:UpdateAssumeRolePolicy (see
  foundation.yaml's TerraformInstallRole iam-operational-role-trust-mgmt
  inline policy).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Core (Required)"
        Parameters:
          - CompanyName
          - Environment
      - Label:
          default: "EKS / OIDC Configuration"
        Parameters:
          - CustomClusterName
          - OIDCProviderUrl
      - Label:
          default: "Operational Role Name Overrides (Optional)"
        Parameters:
          - EBSCSIDriverRoleName
          - EFSCSIDriverRoleName
          - LoadBalancerControllerRoleName
          - ClusterAutoscalerRoleName
          - EKSClusterRoleName
          - EKSWorkerNodeRoleName
          - PGBackupServiceRoleName
          - GlueTrinoServiceRoleName
      - Label:
          default: "Tagging Options"
        Parameters:
          - TagMode
          - CustomTags
    ParameterLabels:
      CompanyName:
        default: "Company Name"
      Environment:
        default: "Environment (dev/qa/preview/prod)"
      CustomClusterName:
        default: "Custom EKS Cluster Name"
      OIDCProviderUrl:
        default: "OIDC Provider URL"
      TagMode:
        default: "Tag Mode"
      CustomTags:
        default: "Custom Tags (Key=Value,Key2=Value2)"

Parameters:
  CompanyName:
    Type: String
    Description: Short company identifier (e.g. acme), lowercase, no spaces (recommended max 15 chars). Appended to all default role names to avoid collisions when multiple Promethium tenants/environments share this AWS account. REQUIRED — must match the CompanyName given to foundation.yaml.

  Environment:
    Type: String
    AllowedValues:
      - dev
      - qa
      - preview
      - prod
    Description: >-
      Deployment environment for this tenant. REQUIRED — no default. Used in
      the default role names so they match the Glue/Trino IRSA role name
      promethium-<Environment>-<CompanyName>-trino-oidc-role that the
      umbrella's trino-sa ServiceAccount annotation expects. Must equal the
      tenant's actual env and match the Environment given to foundation.yaml.

  CustomClusterName:
    Type: String
    Default: ''
    Description: "Optional EKS cluster name override. Leave blank to use the default format promethium-datafabric-<Environment>-<CompanyName>-eks-cluster."

  OIDCProviderUrl:
    Type: String
    Default: oidc.eks.us-east-1.amazonaws.com/id/DUMMY1234567890
    Description: >-
      OIDC Provider URL for the EKS cluster. Leave at the dummy default for
      this initial deploy — Terraform creates the real cluster and OIDC
      provider afterwards, then patches these roles' trust policies to the
      real URL via iam:UpdateAssumeRolePolicy (granted to the Terraform
      deploy role in foundation.yaml).

  EBSCSIDriverRoleName:
    Type: String
    Default: ''
    Description: Custom name for EBS CSI Driver role (optional)

  EFSCSIDriverRoleName:
    Type: String
    Default: ''
    Description: Custom name for EFS CSI Driver role (optional)

  LoadBalancerControllerRoleName:
    Type: String
    Default: ''
    Description: Custom name for Load Balancer Controller role (optional)

  ClusterAutoscalerRoleName:
    Type: String
    Default: ''
    Description: Custom name for Cluster Autoscaler role (optional)

  EKSClusterRoleName:
    Type: String
    Default: ''
    Description: Custom name for EKS Cluster role (optional)

  EKSWorkerNodeRoleName:
    Type: String
    Default: ''
    Description: Custom name for EKS Worker Node role (optional)

  PGBackupServiceRoleName:
    Type: String
    Default: ''
    Description: Custom name for PostgreSQL Backup Service role (optional)

  GlueTrinoServiceRoleName:
    Type: String
    Default: ''
    Description: Custom name for Glue Trino Service role (optional)

  TagMode:
    Type: String
    Default: default
    AllowedValues:
      - default
      - custom
    Description: Choose whether to use default tags or user-supplied custom tags.

  CustomTags:
    Type: String
    Default: ""
    Description: "Custom tags in Key=Value,Key2=Value2 format (used only when TagMode=custom)"

Mappings:
  DefaultTags:
    Values:
      Product: Promethium
      Owner: support@promethium.ai
      createdBy: CloudFormation
      Project: Intelligentedge

Conditions:
  HasCustomClusterName: !Not [!Equals [!Ref CustomClusterName, '']]
  HasCustomEBSRoleName: !Not [!Equals [!Ref EBSCSIDriverRoleName, '']]
  HasCustomEFSRoleName: !Not [!Equals [!Ref EFSCSIDriverRoleName, '']]
  HasCustomLBRoleName: !Not [!Equals [!Ref LoadBalancerControllerRoleName, '']]
  HasCustomCARoleName: !Not [!Equals [!Ref ClusterAutoscalerRoleName, '']]
  HasCustomEKSClusterRoleName: !Not [!Equals [!Ref EKSClusterRoleName, '']]
  HasCustomEKSWorkerRoleName: !Not [!Equals [!Ref EKSWorkerNodeRoleName, '']]
  HasCustomPGBackupRoleName: !Not [!Equals [!Ref PGBackupServiceRoleName, '']]
  HasCustomGlueTrinoRoleName: !Not [!Equals [!Ref GlueTrinoServiceRoleName, '']]

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  # Tag resolver (Lambda-backed custom resource)
  # ═══════════════════════════════════════════════════════════════════════════

  TagResolverFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  TagResolverFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      Role: !GetAtt TagResolverFunctionRole.Arn
      Code:
        ZipFile: |
          import json
          import cfnresponse

          def lambda_handler(event, context):
              try:
                  props = event.get("ResourceProperties", {})
                  tag_mode = props.get("TagMode", "default")
                  default_tags = props.get("DefaultTags", {})
                  custom_tags = props.get("CustomTags", "")

                  tags = []

                  if isinstance(default_tags, dict):
                      for k, v in default_tags.items():
                          tags.append({"Key": k, "Value": v})

                  if tag_mode == "custom" and isinstance(custom_tags, str) and custom_tags.strip() != "":
                      pairs = custom_tags.split(",")
                      for pair in pairs:
                          if "=" in pair:
                              k, v = pair.split("=", 1)
                              tags.append({"Key": k.strip(), "Value": v.strip()})

                  response_data = {"Tags": tags}
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)

              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  TagResolver:
    Type: Custom::TagResolver
    Properties:
      ServiceToken: !GetAtt TagResolverFunction.Arn
      TagMode: !Ref TagMode
      DefaultTags:
        # Environment/Company now come from the real parameters (fixed during
        # merge — operational_roles.yaml previously pulled a static "prod"
        # literal from the Mappings block regardless of the Environment
        # parameter's actual value; see foundation-review.md).
        Environment: !Ref Environment
        Company: !Ref CompanyName
        Product: !FindInMap [DefaultTags, Values, Product]
        Owner: !FindInMap [DefaultTags, Values, Owner]
        createdBy: !FindInMap [DefaultTags, Values, createdBy]
        Project: !FindInMap [DefaultTags, Values, Project]
      CustomTags: !Ref CustomTags

  # ═══════════════════════════════════════════════════════════════════════════
  # 8 operational roles — env-aware default names:
  # promethium-${Environment}-${CompanyName}-<role>. Trust `sub` conditions and
  # policies carry the AllowGlueService/self-PassRole (GlueTrinoServiceRole)
  # and rasa-namespace (PGBackupServiceRole) fixes — see
  # AWS/scripts/role-drift-baseline.json for the source-of-truth citations.
  # ═══════════════════════════════════════════════════════════════════════════

  EBSCSIDriverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomEBSRoleName
        - !Ref EBSCSIDriverRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-ebs-csi-driver-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:ebs-csi-controller-sa"
                    }
                  }
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: EBSCSIKMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - kms:CreateGrant
                  - kms:ListGrants
                  - kms:RevokeGrant
                Condition:
                  Bool:
                    kms:GrantIsForAWSResource: 'true'
                Effect: Allow
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              - Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Effect: Allow
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'

  EFSCSIDriverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomEFSRoleName
        - !Ref EFSCSIDriverRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-efs-csi-driver-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:efs-csi-controller-sa"
                    }
                  }
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: EFSCSIDriverPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - elasticfilesystem:DescribeAccessPoints
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeMountTargets
                  - ec2:DescribeAvailabilityZones
                Effect: Allow
                Resource: '*'
              - Action:
                  - elasticfilesystem:CreateAccessPoint
                Condition:
                  StringLike:
                    aws:RequestTag/cluster-name: !If [HasCustomClusterName, !Ref CustomClusterName, !Sub 'promethium-datafabric-${Environment}-${CompanyName}-eks-cluster']
                    aws:RequestTag/efs.csi.aws.com/cluster: 'true'
                Effect: Allow
                Resource: '*'
              - Action:
                  - elasticfilesystem:DeleteAccessPoint
                Condition:
                  StringLike:
                    aws:RequestTag/cluster-name: !If [HasCustomClusterName, !Ref CustomClusterName, !Sub 'promethium-datafabric-${Environment}-${CompanyName}-eks-cluster']
                    aws:RequestTag/efs.csi.aws.com/cluster: 'true'
                Effect: Allow
                Resource: '*'

  LoadBalancerControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomLBRoleName
        - !Ref LoadBalancerControllerRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-lb-controller-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:aws-load-balancer-controller"
                    }
                  }
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      Path: /
      Tags: !GetAtt TagResolver.Tags

  LoadBalancerControllerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'promethium-${Environment}-${CompanyName}-lbcontroller-policy'
      Roles:
        - !Ref LoadBalancerControllerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeVpcs
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeTags
              - ec2:GetCoipPoolUsage
              - ec2:DescribeCoipPools
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeTags
            Resource: '*'
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - acm:ListCertificates
              - acm:DescribeCertificate
              - iam:ListServerCertificates
              - iam:GetServerCertificate
              - waf-regional:GetWebACL
              - waf-regional:GetWebACLForResource
              - waf-regional:AssociateWebACL
              - waf-regional:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - shield:GetSubscriptionState
              - shield:DescribeProtection
              - shield:CreateProtection
              - shield:DeleteProtection
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
            Resource: '*'
          - Effect: Allow
            Action:
              - ec2:CreateTags
            Resource: 'arn:aws:ec2:*:*:security-group/*'
            Condition:
              StringEquals:
                ec2:CreateAction: CreateSecurityGroup
              'Null':
                'aws:RequestTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: 'arn:aws:ec2:*:*:security-group/*'
            Condition:
              'Null':
                'aws:RequestTag/elbv2.k8s.aws/cluster': 'true'
                'aws:ResourceTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:DeleteSecurityGroup
            Resource: '*'
            Condition:
              'Null':
                'aws:ResourceTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:CreateTargetGroup
            Resource: '*'
            Condition:
              'Null':
                'aws:RequestTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
            Resource: '*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - 'arn:aws:elasticloadbalancing:*:*:targetgroup/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*'
            Condition:
              'Null':
                'aws:RequestTag/elbv2.k8s.aws/cluster': 'true'
                'aws:ResourceTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
              - elasticloadbalancing:RemoveTags
            Resource:
              - 'arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:DeleteTargetGroup
            Resource: '*'
            Condition:
              'Null':
                'aws:ResourceTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:AddTags
            Resource:
              - 'arn:aws:elasticloadbalancing:*:*:targetgroup/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*'
              - 'arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*'
            Condition:
              StringEquals:
                elasticloadbalancing:CreateAction:
                  - CreateTargetGroup
                  - CreateLoadBalancer
              'Null':
                'aws:RequestTag/elbv2.k8s.aws/cluster': 'false'
          - Effect: Allow
            Action:
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
            Resource: 'arn:aws:elasticloadbalancing:*:*:targetgroup/*/*'
          - Effect: Allow
            Action:
              - elasticloadbalancing:SetWebAcl
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:ModifyRule
            Resource: '*'

  ClusterAutoscalerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomCARoleName
        - !Ref ClusterAutoscalerRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-cluster-autoscaler-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": "system:serviceaccount:kube-system:cluster-autoscaler"
                    }
                  }
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: ClusterAutoscalerPolicy
          PolicyDocument:
            Fn::Sub:
              - |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Action": [
                        "autoscaling:SetDesiredCapacity",
                        "autoscaling:TerminateInstanceInAutoScalingGroup"
                      ],
                      "Condition": {
                        "StringEquals": {
                          "aws:ResourceTag/k8s.io/cluster-autoscaler/${ClusterName}": "owned"
                        }
                      },
                      "Effect": "Allow",
                      "Resource": "*",
                      "Sid": "ScalingActions"
                    },
                    {
                      "Action": [
                        "autoscaling:DescribeAutoScalingGroups",
                        "autoscaling:DescribeAutoScalingInstances",
                        "autoscaling:DescribeLaunchConfigurations",
                        "autoscaling:DescribeScalingActivities",
                        "ec2:DescribeImages",
                        "ec2:DescribeInstanceTypes",
                        "ec2:DescribeLaunchTemplateVersions",
                        "ec2:GetInstanceTypesFromInstanceRequirements",
                        "eks:DescribeNodegroup"
                      ],
                      "Effect": "Allow",
                      "Resource": "*",
                      "Sid": "ReadOnlyActions"
                    }
                  ]
                }
              - ClusterName: !If [HasCustomClusterName, !Ref CustomClusterName, !Sub 'promethium-datafabric-${Environment}-${CompanyName}-eks-cluster']

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomEKSClusterRoleName
        - !Ref EKSClusterRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-eks-cluster-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
      Path: /
      Tags: !GetAtt TagResolver.Tags

  EKSWorkerNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomEKSWorkerRoleName
        - !Ref EKSWorkerNodeRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-eks-worker-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: WorkerKMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Effect: Allow
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'

  PGBackupServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomPGBackupRoleName
        - !Ref PGBackupServiceRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-pg-backup-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": [
                        "system:serviceaccount:intelligentedge:s3-backup-sa",
                        "system:serviceaccount:intelligentedge:sa-ecr-registry",
                        "system:serviceaccount:cluster-management:sa-ecr-registry",
                        "system:serviceaccount:rasa:sa-ecr-registry"
                      ]
                    }
                  }
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: PGBackupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Effect: Allow
                Resource: 'arn:aws:s3:::promethium-postgres-backups-*/*'
              - Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Effect: Allow
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              - Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetRepositoryPolicy
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - ecr:GetLifecyclePolicy
                  - ecr:GetLifecyclePolicyPreview
                  - ecr:ListTagsForResource
                  - ecr:DescribeImageScanFindings
                Effect: Allow
                Resource: '*'

  GlueTrinoServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasCustomGlueTrinoRoleName
        - !Ref GlueTrinoServiceRoleName
        - !Sub 'promethium-${Environment}-${CompanyName}-trino-oidc-role'
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::${AWS::AccountId}:oidc-provider/${OIDCProviderUrl}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OIDCProviderUrl}:sub": "system:serviceaccount:intelligentedge:trino-sa"
                    }
                  }
                },
                {
                  "Sid": "AllowGlueService",
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "glue.amazonaws.com"
                  },
                  "Action": "sts:AssumeRole"
                }
              ]
            }
          - OIDCProviderUrl: !Ref OIDCProviderUrl
      Path: /
      Tags: !GetAtt TagResolver.Tags
      Policies:
        - PolicyName: GlueTrinoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchCreatePartition
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:BatchDeleteTable
                  - glue:DeleteDatabase
                  - glue:GetCrawler
                  - glue:DeleteCrawler
                  - glue:StopCrawler
                  - glue:UpdateCrawler
                  - glue:StartCrawler
                  - glue:BatchGetPartition
                Effect: Allow
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/*/*'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/*'
              - Action:
                  - glue:GetCrawlers
                  - glue:ListCrawlers
                  - glue:CreateDatabase
                  - glue:CreateCrawler
                Effect: Allow
                Resource: '*'
              - Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectTagging
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionTagging
                  - s3:GetObjectACL
                  - s3:PutObjectACL
                  - s3:ListBucket
                Effect: Allow
                Resource:
                  - 'arn:aws:s3:::*'
                  - 'arn:aws:s3:::*/*'
              - Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Effect: Allow
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              # Let the Trino IRSA role pass ITSELF to Glue (paired with the
              # AllowGlueService trust statement above) so Glue crawlers/jobs can
              # run under this role — matches legacy trino-oidc.tf, not the
              # unrelated AWSGlueServiceRoleDefault the CFT lineage had.
              - Action:
                  - iam:PassRole
                Effect: Allow
                Resource: !If
                  - HasCustomGlueTrinoRoleName
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GlueTrinoServiceRoleName}'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/promethium-${Environment}-${CompanyName}-trino-oidc-role'
                Condition:
                  StringEquals:
                    iam:PassedToService: glue.amazonaws.com

Outputs:
  EBSCSIDriverRoleArn:
    Description: ARN of the EBS CSI Driver role
    Value: !GetAtt EBSCSIDriverRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EBSCSIRoleArn

  EFSCSIDriverRoleArn:
    Description: ARN of the EFS CSI Driver role
    Value: !GetAtt EFSCSIDriverRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EFSCSIRoleArn

  LoadBalancerControllerRoleArn:
    Description: ARN of the Load Balancer Controller role
    Value: !GetAtt LoadBalancerControllerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LBRoleArn

  ClusterAutoscalerRoleArn:
    Description: ARN of the Cluster Autoscaler role
    Value: !GetAtt ClusterAutoscalerRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CARoleArn

  EKSClusterRoleArn:
    Description: ARN of the EKS Cluster role
    Value: !GetAtt EKSClusterRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EKSClusterRoleArn

  EKSWorkerNodeRoleArn:
